version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: cms-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    container_name: cms-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/college_management
      JWT_SECRET: change_this_secret_in_production
      JWT_EXPIRE: 7d
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo

  client:
    build: ./client
    container_name: cms-client
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  mongo-data:
